plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    if (include.toBoolean()) {
        /*include(modImplementation "com.tterrag.registrate_fabric:Registrate:$rootProject.registrate_fabric_version")*/
        include(modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version")
    }

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // 模组菜单
    modImplementation "curse.maven:modmenu-308702:5162837"

    // 苹果皮
    modImplementation "curse.maven:appleskin-248787:7517366"

    // Cloth Config API
    modImplementation "curse.maven:cloth-config-348521:5729104"

    // Saturation Plus (吃不停)
    modImplementation "curse.maven:saturation-plus-959951:7516112"

    // 玉
    modImplementation "curse.maven:jade-324717:6291330"

    // jei
    modImplementation "curse.maven:jei-238222:7391694"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_description', project.mod_description
    inputs.property 'mod_license', project.mod_license
    inputs.property 'mod_displayName', project.mod_displayName
    inputs.property 'mod_logoFile', project.mod_logoFile
    inputs.property 'mod_authors', project.mod_authors
    inputs.property 'archives_name', project.archives_name
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'architectury_api_version', project.architectury_api_version

    filesMatching('fabric.mod.json') {
        expand(
            version: inputs.properties.version,
            mod_description: inputs.properties.mod_description,
            mod_license: inputs.properties.mod_license,
            mod_displayName: inputs.properties.mod_displayName,
            mod_logoFile: inputs.properties.mod_logoFile,
            mod_authors: inputs.properties.mod_authors,
            archives_name: inputs.properties.archives_name,
            fabric_loader_version: inputs.properties.fabric_loader_version,
            minecraft_version: inputs.properties.minecraft_version,
            architectury_api_version: inputs.properties.architectury_api_version
        )
    }
}

sourceSets.main.resources.srcDirs += [project(':common').file('src/main/resources')]

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
